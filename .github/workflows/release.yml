name: Release

# Tag vX.Y.Z to test, package and publish.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the packager reads tags and history
      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit
      - name: Check
        run: |
          luajit tests/run.lua
          for toc in DontDoThat/DontDoThat_*.toc; do sh tools/check-toc.sh "$toc"; done
          sh tools/check-tocs-match.sh
          bash tools/check-embeds.sh
          sh tools/check-version.sh "${{ github.ref_name }}"
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
